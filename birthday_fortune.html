<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命式鑑定</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0a0800 0%, #1a1200 50%, #0d0a00 100%);
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    color: #e8d48a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes glow {
    0%, 100% { opacity: .6; }
    50% { opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .fade { animation: fadeUp .6s ease both; }

/* Header */
.header { text-align: center; margin-bottom: 36px; }
.header-star { font-size: 30px; animation: glow 3s ease-in-out infinite; }
.header h1 { font-size: 24px; font-weight: 400; letter-spacing: .2em; margin: 8px 0 6px; color: #f0d870; }
.header-sub { font-size: 10px; letter-spacing: .5em; color: #8a7a3a; }

/* Form */
.form-wrap { width: 100%; max-width: 380px; }
.form-desc { text-align: center; margin-bottom: 24px; font-size: 13px; color: #a89040; letter-spacing: .1em; line-height: 1.8; }
.input-row { display: flex; gap: 8px; margin-bottom: 24px; align-items: center; }
.input-row span { color: #8a7a3a; flex-shrink: 0; }
input[type=number] {
background: rgba(255,215,100,.05);
border: 1px solid rgba(255,215,100,.25);
border-radius: 10px;
color: #e8d48a;
font-size: 16px;
font-family: inherit;
text-align: center;
outline: none;
padding: 14px 6px;
transition: border-color .2s;
-moz-appearance: textfield;
}
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type=number]:focus { border-color: rgba(255,215,100,.6); background: rgba(255,215,100,.08); }
#year-input { flex: 2; }
#month-input, #day-input { flex: 1; }

.btn-main {
width: 100%;
padding: 16px;
background: linear-gradient(135deg, #c8960a, #e8c84a, #c8960a);
color: #0a0800;
border: none;
border-radius: 50px;
font-size: 15px;
font-family: inherit;
font-weight: bold;
letter-spacing: .2em;
cursor: pointer;
box-shadow: 0 4px 20px rgba(200,150,10,.4);
transition: transform .2s, box-shadow .2s;
}
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(200,150,10,.5); }
.btn-main:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.error-box {
color: #f87171;
font-size: 12px;
background: rgba(248,113,113,.08);
border: 1px solid rgba(248,113,113,.2);
border-radius: 10px;
padding: 12px;
margin-bottom: 14px;
word-break: break-all;
line-height: 1.6;
}

/* Loading */
.loading { text-align: center; padding: 50px 0; }
.loading-star { font-size: 36px; animation: spin 3s linear infinite; display: inline-block; margin-bottom: 16px; }
.loading-text { font-size: 13px; color: #a89040; letter-spacing: .3em; }

/* Result */
.result-wrap { width: 100%; max-width: 420px; }
.birth-header { text-align: center; margin-bottom: 20px; }
.birth-date { font-size: 12px; color: #8a7a3a; margin-bottom: 12px; letter-spacing: .2em; }
.sign-row { display: flex; justify-content: center; gap: 32px; }
.sign-item { text-align: center; }
.sign-emoji { font-size: 28px; }
.sign-name { font-size: 11px; color: #c8a840; margin-top: 4px; }
.sign-divider { width: 1px; background: rgba(255,215,100,.15); }

.card {
background: rgba(255,255,255,.03);
border: 1px solid rgba(255,215,100,.15);
border-radius: 16px;
padding: 18px;
margin-bottom: 12px;
}
.lbl { font-size: 9px; letter-spacing: .4em; color: #b8960a; margin-bottom: 8px; text-transform: uppercase; }
.catch { font-size: 18px; color: #f0d870; margin-bottom: 12px; }
.core { font-size: 13px; color: #c8b860; line-height: 1.9; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sub-card { background: rgba(255,215,100,.04); border-radius: 10px; padding: 11px; }
.sub-lbl { font-size: 9px; letter-spacing: .3em; color: #8a7a3a; margin-bottom: 5px; }
.sub-val { font-size: 12px; color: #c8b060; line-height: 1.6; }
.sub-val.gold { color: #d4af37; }

.year-fortune { font-size: 13px; color: #d4b84a; line-height: 2; margin-bottom: 12px; }

.lucky-row { display: flex; justify-content: space-around; text-align: center; }
.lucky-item .lucky-lbl { font-size: 9px; letter-spacing: .3em; color: #8a7a3a; margin-bottom: 6px; }
.lucky-item .lucky-val { font-size: 14px; color: #e8d48a; }
.lucky-item .lucky-val.big { font-size: 22px; color: #f0d870; font-weight: bold; }

.advice-card { text-align: center; border-color: rgba(255,215,100,.25) !important; }
.advice-text { font-size: 15px; color: #f0d870; line-height: 2; font-style: italic; }

.btn-reset {
display: block;
margin: 8px auto 0;
background: transparent;
border: 1px solid rgba(255,215,100,.25);
color: #8a7a3a;
padding: 10px 28px;
border-radius: 24px;
cursor: pointer;
font-size: 13px;
letter-spacing: .2em;
font-family: inherit;
}

.hidden { display: none; }
</style>

</head>
<body>

<!-- Header -->

<div class="header fade">
  <div class="header-star">✦</div>
  <h1>命式鑑定</h1>
  <div class="header-sub">BIRTH CHART READING</div>
</div>

<!-- Form -->

<div class="form-wrap fade" id="form-section">
  <div class="form-desc">生年月日を入力してください</div>
  <div class="input-row">
    <input type="number" id="year-input" placeholder="西暦" min="1900" max="2010">
    <span>年</span>
    <input type="number" id="month-input" placeholder="月" min="1" max="12">
    <span>月</span>
    <input type="number" id="day-input" placeholder="日" min="1" max="31">
    <span>日</span>
  </div>
  <div id="error-box" class="error-box hidden"></div>
  <button class="btn-main" id="btn-analyze" onclick="analyze()">✦ 鑑定する ✦</button>
</div>

<!-- Loading -->

<div class="loading hidden" id="loading-section">
  <div class="loading-star">✦</div>
  <div class="loading-text">命式を読み解いています…</div>
</div>

<!-- Result -->

<div class="result-wrap hidden" id="result-section"></div>

<script>
function getZodiac(month, day) {
  const signs = [
    { name: "山羊座", emoji: "♑", m: 12, d: 22 },
    { name: "水瓶座", emoji: "♒", m: 1,  d: 20 },
    { name: "魚座",   emoji: "♓", m: 2,  d: 19 },
    { name: "牡羊座", emoji: "♈", m: 3,  d: 21 },
    { name: "牡牛座", emoji: "♉", m: 4,  d: 20 },
    { name: "双子座", emoji: "♊", m: 5,  d: 21 },
    { name: "蟹座",   emoji: "♋", m: 6,  d: 21 },
    { name: "獅子座", emoji: "♌", m: 7,  d: 23 },
    { name: "乙女座", emoji: "♍", m: 8,  d: 23 },
    { name: "天秤座", emoji: "♎", m: 9,  d: 23 },
    { name: "蠍座",   emoji: "♏", m: 10, d: 23 },
    { name: "射手座", emoji: "♐", m: 11, d: 22 },
  ];
  for (let i = signs.length - 1; i >= 0; i--) {
    if (month > signs[i].m || (month === signs[i].m && day >= signs[i].d)) return signs[i];
  }
  return signs[0];
}

function getAnimal(year) {
  const list = [
    { name: "鼠", emoji: "🐭" }, { name: "牛", emoji: "🐮" },
    { name: "虎", emoji: "🐯" }, { name: "兎", emoji: "🐰" },
    { name: "龍", emoji: "🐲" }, { name: "蛇", emoji: "🐍" },
    { name: "馬", emoji: "🐴" }, { name: "羊", emoji: "🐑" },
    { name: "猿", emoji: "🐒" }, { name: "鶏", emoji: "🐓" },
    { name: "犬", emoji: "🐕" }, { name: "猪", emoji: "🐗" },
  ];
  return list[((year - 4) % 12 + 12) % 12];
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = '⚠️ ' + msg;
  el.classList.remove('hidden');
}

function hideError() {
  document.getElementById('error-box').classList.add('hidden');
}

async function analyze() {
  const year  = parseInt(document.getElementById('year-input').value);
  const month = parseInt(document.getElementById('month-input').value);
  const day   = parseInt(document.getElementById('day-input').value);

  if (!year || !month || !day) return;

  hideError();
  document.getElementById('form-section').classList.add('hidden');
  document.getElementById('loading-section').classList.remove('hidden');
  document.getElementById('result-section').classList.add('hidden');

  const zodiac = getZodiac(month, day);
  const animal = getAnimal(year);

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1200,
        messages: [{
          role: "user",
          content: `あなたは占い師です。${year}年${month}月${day}日生まれ（${zodiac.name}・${animal.name}年）の人を占ってください。

以下のJSONだけを返してください。説明文は不要です：

{"catch":"性格キャッチコピー10字以内","core":"核となる性格60字以内","strength":"強み35字以内","weakness":"課題35字以内","year_fortune":"今年の運勢50字以内","work":"仕事運35字以内","love":"恋愛運35字以内","money":"金運35字以内","lucky_color":"ラッキーカラー","lucky_number":7,"lucky_item":"ラッキーアイテム","best_sign":"相性最良の星座","advice":"人生のメッセージ45字以内"}`
        }]
      })
    });

    if (!response.ok) {
      const t = await response.text();
      throw new Error('API ' + response.status + ': ' + t.slice(0, 100));
    }

    const data = await response.json();
    const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('レスポンス解析失敗: ' + raw.slice(0, 80));

    const r = JSON.parse(match[0]);
    showResult(r, zodiac, animal, `${year}年${month}月${day}日`);

  } catch(e) {
    document.getElementById('loading-section').classList.add('hidden');
    document.getElementById('form-section').classList.remove('hidden');
    showError(e.message);
  }
}

function showResult(r, zodiac, animal, birthday) {
  document.getElementById('loading-section').classList.add('hidden');

  const sec = document.getElementById('result-section');
  sec.innerHTML = `
    <div class="birth-header fade">
      <div class="birth-date">${birthday}</div>
      <div class="sign-row">
        <div class="sign-item">
          <div class="sign-emoji">${zodiac.emoji}</div>
          <div class="sign-name">${zodiac.name}</div>
        </div>
        <div class="sign-divider"></div>
        <div class="sign-item">
          <div class="sign-emoji">${animal.emoji}</div>
          <div class="sign-name">${animal.name}年</div>
        </div>
      </div>
    </div>

    <div class="card fade" style="animation-delay:.1s">
      <div class="lbl">性格鑑定</div>
      <div class="catch">「${r.catch}」</div>
      <div class="core">${r.core}</div>
      <div class="grid2">
        <div class="sub-card">
          <div class="sub-lbl">強み</div>
          <div class="sub-val gold">${r.strength}</div>
        </div>
        <div class="sub-card">
          <div class="sub-lbl">課題</div>
          <div class="sub-val">${r.weakness}</div>
        </div>
      </div>
    </div>

    <div class="card fade" style="animation-delay:.2s">
      <div class="lbl">今年の運勢</div>
      <div class="year-fortune">${r.year_fortune}</div>
      <div class="grid2">
        <div class="sub-card"><div class="sub-lbl">仕事運</div><div class="sub-val">${r.work}</div></div>
        <div class="sub-card"><div class="sub-lbl">恋愛運</div><div class="sub-val">${r.love}</div></div>
        <div class="sub-card"><div class="sub-lbl">金運</div><div class="sub-val">${r.money}</div></div>
      </div>
    </div>

    <div class="card fade" style="animation-delay:.3s">
      <div class="lbl">Lucky</div>
      <div class="lucky-row">
        <div class="lucky-item">
          <div class="lucky-lbl">COLOR</div>
          <div class="lucky-val">🎨 ${r.lucky_color}</div>
        </div>
        <div class="lucky-item">
          <div class="lucky-lbl">NUMBER</div>
          <div class="lucky-val big">${r.lucky_number}</div>
        </div>
        <div class="lucky-item">
          <div class="lucky-lbl">ITEM</div>
          <div class="lucky-val">✨ ${r.lucky_item}</div>
        </div>
      </div>
    </div>

    <div class="card fade" style="animation-delay:.35s">
      <div class="lbl">相性最良</div>
      <div style="font-size:15px;color:#f0d870">💛 ${r.best_sign}</div>
    </div>

    <div class="card advice-card fade" style="animation-delay:.4s">
      <div class="lbl">人生のメッセージ</div>
      <div class="advice-text">「${r.advice}」</div>
    </div>

    <button class="btn-reset" onclick="reset()">✦ 別の日付で鑑定する</button>
  `;
  sec.classList.remove('hidden');
}

function reset() {
  document.getElementById('result-section').classList.add('hidden');
  document.getElementById('form-section').classList.remove('hidden');
  document.getElementById('year-input').value = '';
  document.getElementById('month-input').value = '';
  document.getElementById('day-input').value = '';
  hideError();
}
</script>

</body>
</html>
